name: CPU correctness and offline replay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/cpu-tested.txt -e ".[cpu,dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -S scripts/analyse.py --runs-dir evidence hf-fixed vllm-fixed --svg evidence/phase-times.svg
      - run: python -S scripts/compare_backends.py --backend report --out-dir evidence/comparison
      - run: git diff --exit-code -- evidence
