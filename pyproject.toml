[project]
name = "rl-velocity"
version = "0.1.0"
description = "Instrumented GRPO harness for measuring where RL training compute actually goes"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "accelerate",
    "vllm",
]

[project.optional-dependencies]
analysis = ["pandas", "matplotlib", "pyarrow"]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlv"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
