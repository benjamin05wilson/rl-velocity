[project]
name = "rl-velocity"
version = "0.1.0"
description = "Instrumented GRPO harness for measuring where RL training compute actually goes"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# CPU correctness suite: no transformers, datasets, model downloads or vLLM.
cpu = ["torch>=2.6,<3"]
train = ["torch>=2.6,<3", "transformers>=5.0,<6", "datasets>=3,<5", "accelerate>=1,<2"]
vllm = ["vllm>=0.24,<0.29; sys_platform == 'linux'"]
dev = ["ruff>=0.12,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlv"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
